name: CI/CD – Springuma Hospital App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: practica7ips
  K8S_DEPLOYMENT: springuma-deployment
  K8S_NAMESPACE: default

jobs:
  build-and-push:
    name: 🔨 Build · Test · Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & run tests (Maven)
        run: mvn verify -q

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export image SHA tag
        id: tag
        run: echo "sha_tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    outputs:
      sha_tag: ${{ steps.tag.outputs.sha_tag }}

  deploy:
    name: 🚀 Deploy to Kubernetes
    needs: build-and-push
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Deployment image tag
        run: kubectl set image deployment/${{ env.K8S_DEPLOYMENT }} springuma=${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.sha_tag }} --namespace ${{ env.K8S_NAMESPACE }}

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/deployment.yaml --namespace ${{ env.K8S_NAMESPACE }}

      - name: Apply Kubernetes service
        run: kubectl apply -f k8s/service.yaml --namespace ${{ env.K8S_NAMESPACE }}

      - name: Wait for rollout to complete
        run: kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT }} --namespace ${{ env.K8S_NAMESPACE }} --timeout=180s

      - name: Show pods
        run: kubectl get pods -l app=springuma --namespace ${{ env.K8S_NAMESPACE }}

      - name: Show service
        run: kubectl get svc springuma-service --namespace ${{ env.K8S_NAMESPACE }}

      - name: Show deployed image
        run: kubectl describe deployment/${{ env.K8S_DEPLOYMENT }} --namespace ${{ env.K8S_NAMESPACE }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: springuma-deployment
  namespace: default
  labels:
    app: springuma
    version: "1.0"
spec:
  replicas: 2                   
  selector:
    matchLabels:
      app: springuma
  strategy:
    type: RollingUpdate          
    rollingUpdate:
      maxSurge: 1            
      maxUnavailable: 0      
  template:
    metadata:
      labels:
        app: springuma
    spec:
      containers:
        - name: springuma
          image: laiadiaz/practica7ips:latest
          imagePullPolicy: Always  
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: JAVA_OPTS
              value: "-Xmx384m -Xms128m"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
